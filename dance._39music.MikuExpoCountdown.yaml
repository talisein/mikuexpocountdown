app-id: dance._39music.MikuExpoCountdown
collection-id: dance._39music.Apps
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: mikuexpo-countdown
finish-args: ['--socket=wayland', '--device=dri', '--talk-name=org.gnome.Shell.SearchProvider2']
modules:
  - name: peel
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.gnome.org/bugaevc/peel.git
        commit: f3b3b300e0f83013553b54125e23b8e53f555dba
  - name: mikuexpo-countdown
    buildsystem: meson
    run-tests: true
    config-opts:
      - --wrap-mode=nodownload
    sources:
      # The working tree, so CI builds the commit it checked out.
      - type: dir
        path: .
        skip:
          - build
          - build-dir
          - countdown-repo
          - repo
          - .flatpak-builder
          - .git
          - .cache
          - .claude
          - tmp
          - screenshots
          - subprojects/peel
